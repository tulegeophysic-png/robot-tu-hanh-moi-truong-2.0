<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraBot AI - Hệ Thống Giám Sát Môi Trường & Cảnh Báo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="emergency-banner" class="emergency-banner hidden">
        <div class="banner-content">
            <i class="fa-solid fa-triangle-exclamation fa-beat"></i>
            <span id="emergency-text">CẢNH BÁO NGUY HẠI KHẨN CẤP!</span>
            <button onclick="dismissEmergency()" class="btn-dismiss">ĐÃ XỬ LÝ / TẮT CÒI</button>
        </div>
    </div>

    <div class="dashboard">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <h1>AuraBot <span>AI Monitor v2.0</span></h1>
            </div>
            <div class="robot-status">
                <span>Trạng thái: </span>
                <strong id="robot-state-text">Đang đo & quét</strong>
            </div>
        </header>

        <section class="control-panel">
            <div class="control-group">
                <h3><i class="fa-solid fa-power-off"></i> BẬT/TẮT ROBOT THỦ CÔNG:</h3>
                <label class="toggle-switch">
                    <input type="checkbox" id="power-toggle" checked onchange="toggleRobotPower(this)">
                    <span class="slider round"></span>
                </label>
                <span id="power-status-label" class="status-label active">ON (Hoạt động)</span>
            </div>

            <div class="control-group">
                <h3><i class="fa-solid fa-plug-circle-bolt"></i> CHẾ ĐỘ SẠC THỦ CÔNG:</h3>
                <button id="btn-manual-charge" class="btn btn-charge" onclick="toggleManualCharging()">
                    <i class="fa-solid fa-charging-station"></i> <span id="btn-charge-text">Gọi Robot Về Sạc</span>
                </button>
                <button class="btn btn-reset" onclick="resetBattery()">
                    <i class="fa-solid fa-battery-full"></i> Reset Pin 100%
                </button>
            </div>
        </section>

        <main class="main-content">
            <section class="metrics-grid">
                <div class="metric-card" id="card-battery">
                    <i class="fa-solid fa-battery-three-quarters icon battery"></i>
                    <div class="metric-info">
                        <label>Dung Lượng Pin</label>
                        <div><span class="value" id="val-battery">100</span> <span class="unit">%</span></div>
                        <small id="battery-status-sub">Trạng thái: Đang xả pin</small>
                    </div>
                </div>

                <div class="metric-card" id="card-gas">
                    <i class="fa-solid fa-fire-flame-curved icon gas"></i>
                    <div class="metric-info">
                        <label>Nồng Độ Khí Gas / Khói</label>
                        <div><span class="value" id="val-gas">120</span> <span class="unit">PPM</span></div>
                        <small id="gas-status-sub" class="text-safe">An Toàn</small>
                    </div>
                </div>

                <div class="metric-card" id="card-temp">
                    <i class="fa-solid fa-temperature-high icon temp"></i>
                    <div class="metric-info">
                        <label>Nhiệt Độ</label>
                        <div><span class="value" id="val-temp">28.5</span> <span class="unit">°C</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-droplet icon humidity"></i>
                    <div class="metric-info">
                        <label>Độ Ẩm</label>
                        <div><span class="value" id="val-humidity">62.0</span> <span class="unit">%</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-smog icon pm25"></i>
                    <div class="metric-info">
                        <label>Bụi Mịn PM2.5</label>
                        <div><span class="value" id="val-pm25">35.0</span> <span class="unit">µg/m³</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-wind icon co2"></i>
                    <div class="metric-info">
                        <label>Khí CO2</label>
                        <div><span class="value" id="val-co2">450</span> <span class="unit">ppm</span></div>
                    </div>
                </div>
            </section>

            <section class="dashboard-body">
                <div class="chart-container">
                    <h3><i class="fa-solid fa-chart-line"></i> Biểu Đồ Môi Trường Real-Time</h3>
                    <canvas id="envChart"></canvas>
                </div>

                <div class="logs-container">
                    <h3><i class="fa-solid fa-list-check"></i> Nhật Ký Hệ Thống & Cảnh Báo</h3>
                    <div class="log-box" id="system-logs"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
