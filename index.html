<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraBot AI - Hệ Thống Giám Sát Môi Trường</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-robot"></i>
                <h1>AuraBot <span>AI Monitor</span></h1>
            </div>
            <div class="robot-status">
                <span>Trạng thái Robot: </span>
                <strong id="robot-state-text">Đang đo & quét</strong>
            </div>
        </header>

        <section class="control-panel">
            <h3><i class="fa-solid fa-sliders"></i> Điều Điều Khiển Thủ Công</h3>
            <div class="control-buttons">
                <button id="btn-toggle-charge" class="btn btn-charge" onclick="toggleCharging()">
                    <i class="fa-solid fa-plug-circle-bolt"></i> <span id="btn-charge-text">Cho Robot Đi Sạc (Thủ Công)</span>
                </button>
                <button class="btn btn-reset" onclick="resetBattery()">
                    <i class="fa-solid fa-battery-full"></i> Reset Pin 100%
                </button>
            </div>
        </section>

        <main class="main-content">
            <section class="metrics-grid">
                <div class="metric-card" id="card-battery">
                    <i class="fa-solid fa-battery-three-quarters icon battery"></i>
                    <div class="metric-info">
                        <label>Dung Lượng Pin</label>
                        <div><span class="value" id="val-battery">100</span> <span class="unit">%</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-temperature-high icon temp"></i>
                    <div class="metric-info">
                        <label>Nhiệt Độ</label>
                        <div><span class="value" id="val-temp">28.5</span> <span class="unit">°C</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-droplet icon humidity"></i>
                    <div class="metric-info">
                        <label>Độ Ẩm</label>
                        <div><span class="value" id="val-humidity">62.0</span> <span class="unit">%</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-smog icon pm25"></i>
                    <div class="metric-info">
                        <label>Bụi Mịn PM2.5</label>
                        <div><span class="value" id="val-pm25">35.0</span> <span class="unit">µg/m³</span></div>
                    </div>
                </div>

                <div class="metric-card">
                    <i class="fa-solid fa-wind icon co2"></i>
                    <div class="metric-info">
                        <label>Khí CO2</label>
                        <div><span class="value" id="val-co2">450</span> <span class="unit">ppm</span></div>
                    </div>
                </div>
            </section>

            <section class="dashboard-body">
                <div class="chart-container">
                    <h3><i class="fa-solid fa-chart-line"></i> Biểu Đồ Môi Trường Real-Time</h3>
                    <canvas id="envChart"></canvas>
                </div>

                <div class="logs-container">
                    <h3><i class="fa-solid fa-list-check"></i> Nhật Ký Hệ Thống</h3>
                    <div class="log-box" id="system-logs"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
